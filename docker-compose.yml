services:
  api:
    build: .
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
  web:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev:web"
    ports:
      - "3000:3000"
    environment:
      BACKEND_URL: http://api:8000
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    depends_on:
      - api
volumes:
  node_modules:
